# The download website (site/) on GitHub Pages: Settings → Pages → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/customize/mods/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The gallery's downloads: one zip per mod folder (docs/customize/mods).
      - name: Zip the mods
        run: |
          cd docs/customize/mods
          for mod in */; do zip -qr "../../../site/mods/${mod%/}.zip" "$mod"; done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
