# Official builds: signed for Widevine VMP (castLabs EVS), Apple (Developer ID + notarization) and
# Authenticode, then published to GitHub Releases, where the website and the in-app updater find
# them. Runs on a version tag (git tag v0.1.0 && git push --tags); pull requests never see the secrets.
# Missing secrets give an unsigned « preview » build instead of failing (see « Signing setup »).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # One release for both builds: when each build created its own, the tag got two releases and
  # « latest » pointed at the one without the Mac files (the website's Mac link gave a 404).
  # It stays a draft until every build has uploaded, so « latest » never points at a half release.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" --notes ''

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run build:mac -- --publish always
          - os: windows-latest
            command: npm run build:win -- --publish always
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade castlabs-evs
      - run: npm ci
      - name: Check that the tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Without the signing secrets (not set up yet), the release is a « preview »: unsigned
      # (ad-hoc on macOS, so Apple silicon runs it after « Open anyway »), not notarized, no VMP.
      # Only the secrets that exist are passed on: an empty CSC_LINK would make electron-builder fail.
      - name: Signing setup
        shell: bash
        env:
          EVS_ACCOUNT: ${{ secrets.EVS_ACCOUNT }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Google Drive sharing of screen recordings (docs/DRIVE.md): built into the app.
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          for name in EVS_ACCOUNT EVS_PASSWD CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID MAIN_VITE_GOOGLE_CLIENT_ID MAIN_VITE_GOOGLE_CLIENT_SECRET; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done
          extra=''
          if [ -z "$EVS_ACCOUNT" ]; then echo 'ZAK_SKIP_VMP=1' >> "$GITHUB_ENV"; echo '::warning::No EVS account: no VMP signature, Netflix & co. will refuse this build'; fi
          if [ -z "$CSC_LINK" ]; then
            echo 'CSC_IDENTITY_AUTO_DISCOVERY=false' >> "$GITHUB_ENV"
            echo "::warning::No ${RUNNER_OS} code signing certificate: unsigned preview build"
            if [ "$RUNNER_OS" = macOS ]; then extra='-c.mac.identity=- -c.mac.notarize=false'; fi
          fi
          echo "BUILDER_EXTRA=$extra" >> "$GITHUB_ENV"
      - name: Build, sign and publish
        shell: bash
        run: ${{ matrix.command }} $BUILDER_EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release once every build is in
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
