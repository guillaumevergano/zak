name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Click …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ZAK version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, site URL, extensions installed…
